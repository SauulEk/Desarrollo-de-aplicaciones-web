<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DynaDoc - Inicio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .welcome-box {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        h1 { color: #2c3e50; }
        p { color: #666; margin-bottom: 30px; }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="welcome-box">
        <h1>Bienvenido a DynaDoc</h1>
        <p>Gestiona, crea y genera tus currículums profesionales en PDF de manera dinámica.</p>
        <a href="login.html" class="btn">Ingresar a la Plataforma</a>
    </div>

    <script>
        // Si el usuario ya tiene token, lo enviamos directo a la aplicación
        if(localStorage.getItem('token')) {
            window.location.href = 'generador.html';
        }
    </script>
</body>
</html>
